<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="$og_type">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$share_image">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Mohamed Ibrahim, Applied AI Engineer based in Cairo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  <meta name="twitter:image" content="$share_image">
  <link rel="icon" href="${root}assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="${root}assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="${root}assets/styles.css">
  <script type="application/ld+json">$schema</script>
  <script defer src="${root}assets/main.js"></script>
</head>
<body id="top">
  $symbols
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a href="${home}#home" class="brand">$wordmark <span class="brand-long">Mohamed Ibrahim</span><span class="brand-short">M. Ibrahim</span><span class="sr-only">, home</span></a>
      <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
        $nav
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Change color theme" hidden>$sun$moon</button>
        <a class="nav-contact" href="${home}#contact">Get in touch</a>
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation" hidden>$menu$close</button>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">$main</main>
  <footer>
    <div class="wrap footer-inner"><a class="brand" href="${home}#home">$wordmark<span>Mohamed Ibrahim</span></a><span>AI Engineer · Cairo, Egypt</span><a class="text-link" href="#top">Back to top</a></div>
  </footer>
</body>
</html>
